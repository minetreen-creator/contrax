name: Build Check
# Deploy-blocking build gate: reproduces the Vercel prebuilt pipeline
# (build-vercel.sh -> .vercel/output) and validates the Build Output API
# bundle BEFORE merge, so a broken prod build can never reach production.
# Order matters:
#   1. frozen-lockfile install
#   2. route JSX syntax check (faill fast on malformed TSX)
#   3. build .vercel/output (vite build + vercel-entry bundle) — this also
#      GENERATES src/routeTree.gen.ts
#   4. prod-config typecheck AFTER route generation (routeTree.gen.ts must
#      exist first — never typecheck before it) — LINE-NUMBER-FREE FINGERPRINT
#      BASELINE-DELTA GATE (owner-approved, PR #375; fingerprints added for
#      backlog 33fa250b): a committed baseline (.github/typecheck-baseline.txt)
#      lists origin/main's PRE-EXISTING prod-config type errors; BOTH sides are
#      normalized by scripts/typecheck-fingerprint.sh — which drops the
#      `(line,col)` position and keeps file + TS code + message — before the
#      sort -u + diff -u, so the compared unit is a stable FINGERPRINT. The job
#      prints the CURRENT fingerprint count + the baseline fingerprint count + an
#      explicit unified diff vs the baseline and FAILS on added lines (new
#      errors) AND on removed lines (visible baseline mismatch requiring a
#      deliberate baseline-file update). A harmless line-number shift above a
#      pre-existing error is now a 0-delta no-op (it used to need a manual
#      baseline edit: #392, #393, #394). Pass note wording: "pre-existing
#      baseline + line-number-free fingerprint delta gate — PASS ..." — never
#      "typecheck-clean".
#      noUnusedLocals/noUnusedParameters remain true in tsconfig.prod.json.
#   5. Build Output API validation (config.json v3, nodejs22.x, render bundle
#      <= 12 MB)
#   6. bundled request-context integration test against the ASSEMBLED render
#      function (executes .vercel/output/functions/render.func/index.mjs —
#      concurrent request isolation, authenticated SSR via the global accessor
#      registry, error-cleanup, per-request IP). DB-dependent cases run when
#      DATABASE_URL is present and are explicitly skipped otherwise.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Typecheck (post-build) + bundle validation + integration test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Founding Business pricing and fulfillment tests
        run: bun test src/lib/founding-business.test.ts
      - name: Retired founders checkout and email offer tests
        run: |
          bun test src/lib/annual-billing.test.ts
          bun test src/lib/weekly-digest.test.ts
      - name: Local award accounting and calculator tests
        run: bun test src/lib/local-awards/model.test.ts src/lib/win-calculator.test.ts
      - name: Route JSX syntax check
        run: bun run check:routes
      - name: Build .vercel/output (Build Output API v3)
        run: bash build-vercel.sh
      # Line-number-free fingerprint baseline-delta gate (owner-approved, PR #375;
      # fingerprints added for backlog 33fa250b). The whole gate lives in
      # scripts/typecheck-baseline-gate.sh so CI and a local run are byte-identical:
      # it runs `bun run typecheck`, normalizes BOTH sides through
      # scripts/typecheck-fingerprint.sh (drops the `(line,col)` position; keeps
      # file + TS code + message), then does the same sort -u + diff -u and the
      # same FAIL-on-ANY-delta behaviour as before:
      #   - added fingerprint   = NEW error introduced by the branch → fail;
      #   - removed fingerprint = baseline mismatch (fixed error / drift) → fail,
      #     surfacing as a visible diff that needs a DELIBERATE baseline update;
      #   - a line-number shift alone = 0 delta → pass (no more manual baseline
      #     edits: #392, #393, #394).
      # Never a silent pass, never described as typecheck-clean (the pre-existing
      # errors in the baseline still exist). Must stay AFTER the vite build:
      # routeTree.gen.ts has to exist or tsc emits fake TS2307 cascades.
      - name: Typecheck (prod config) — pre-existing baseline + line-number-free fingerprint delta gate
        run: bash scripts/typecheck-baseline-gate.sh
      - name: Validate .vercel/output bundle
        run: |
          set -euo pipefail
          test -f .vercel/output/config.json || { echo "missing config.json"; exit 1; }
          grep -q '"version": 3' .vercel/output/config.json || { echo "config.json version != 3"; exit 1; }
          test -f .vercel/output/functions/render.func/.vc-config.json || { echo "missing render.func/.vc-config.json"; exit 1; }
          grep -q 'nodejs22.x' .vercel/output/functions/render.func/.vc-config.json || { echo "vc-config runtime != nodejs22.x"; exit 1; }
          SIZE=$(stat -c%s .vercel/output/functions/render.func/index.mjs)
          echo "render.func/index.mjs size: $SIZE bytes"
          TOTAL=$(du -sb .vercel/output | cut -f1)
          echo ".vercel/output total bytes: $TOTAL"
          if [ "$SIZE" -gt $((12 * 1024 * 1024)) ]; then
            echo "FAIL: render function bundle exceeds 12 MB ceiling ($SIZE bytes)"
            exit 1
          fi
          echo "bundle validation OK"
      - name: Bundled request-context integration test (assembled render function)
        run: bun test tests/request-context.bundled.test.ts
      # Homepage cache policy (owner-approved F1, 2026-09-21). Deterministic,
      # zero network, no DATABASE_URL: it asserts the public SSR edge-cache
      # allowlist never contains `/` (the session-dependent front door that was
      # serving cached signed-out HTML to signed-in visitors), that the other
      # cookie-agnostic marketing routes stay cached, and that the launcher
      # delegates to the policy module instead of re-inlining a `/` rule.
      - name: Homepage cache policy tests (unit, deterministic, zero network)
        run: bun test src/lib/ssr-cache-policy.test.ts
      # HOMEPAGE GRANTS PLUS FAIL-SAFE (owner directive rev 327, 2026-09-23).
      # DETERMINISTIC and network-free by construction: every input is a literal,
      # the tier table is rendered to static markup in-process (react-dom/server),
      # and there is no DATABASE_URL, no clock, no fetch and no Stripe symbol. It
      # pins the directive's three paths — normal (flag on ⇒ the launched
      # "Get Grants Plus →" → /grants row, byte-for-byte, and zero "Coming soon"),
      # fallback (flag off/absent ⇒ the row's CTA is plain non-interactive text
      # with NO href/button/payment link), and fail-closed (absent/garbage/throwing
      # env ⇒ disabled; the loader reads the flag once, server-side, and the other
      # two tier rows are never gated). Listed EXPLICITLY because a new
      # deterministic suite that no workflow names runs nowhere (the reason
      # runner.dedupe.test.ts went unrun for weeks).
      - name: Homepage grants fail-safe tests (unit, deterministic, zero network)
        run: bun test tests/homepage-grants-failsafe.test.tsx
      # Nonprofit Free (owner green-lit 2026-09-21, six-point spec). The phase-1 unit
      # suite is DETERMINISTIC and network-free by construction: every IRS byte it reads is
      # a verbatim fixture committed to src/lib/fixtures/irs/, and the store is injected —
      # so it needs no DATABASE_URL and is safe on every PR. Without this step the
      # nonprofit code would have no test coverage in CI at all.
      - name: Nonprofit Free tests (unit, deterministic, zero network)
        run: bun test src/lib/nonprofit-free.test.ts
      # Nonprofit Free phase 2 (unit A + unit B, owner green-lit 2026-09-21). The always-on
      # half is deterministic and database-free: migration 046 ↔ src/db/schema.sql mirror
      # assertions, the apply flow's order of operations (a malformed EIN writes nothing, a
      # duplicate EIN never reaches the engine), the released-EIN claim semantics, the
      # writer's decision → audit-column mapping and the copy rules; plus unit B's review
      # queue (the four guarded transitions, the 0-row guard ⇒ 409, one append-only audit row
      # per action, the SLA clock, the reviewer projection's minimality and the amended
      # request_info CHECK). The DB half is OPT-IN and runs only when the repo has a
      # DATABASE_URL secret: it builds a throwaway database from src/db/schema.sql ALONE and
      # drops it again — the same discipline as the state-grants bootstrap test — to prove
      # the PARTIAL unique index on `ein` really makes a released EIN claimable and that the
      # guarded UPDATE + audit INSERT behave as the owner's locks require. Migration 046's
      # hand-run runner is never invoked here (deliberate: it must not be reachable from CI).
      - name: Nonprofit Free phase 2 tests (unit + schema bootstrap when available)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NONPROFIT_TEST_PROVISION_SCHEMA: "1"
        run: |
          set -uo pipefail
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL present — the phase-2 schema bootstrap suites will build throwaway databases from src/db/schema.sql."
          else
            echo "DATABASE_URL secret NOT configured — the phase-2 bootstrap suites skip loudly (the unit half still must pass)."
          fi
          bun test src/lib/nonprofit-apply.test.ts src/lib/nonprofit-apply.integration.test.ts src/lib/nonprofit-review.test.ts src/lib/nonprofit-review.integration.test.ts
      # Janitorial + trucking ingestion (owner PRIORITY 09-21, R1–R4). DETERMINISTIC
      # and network-free by construction: every SAM.gov byte these suites read is a
      # committed fixture captured from the official API
      # (src/jobs/sources/fixtures/sam-trades/), and the per-opportunity detail
      # fetcher is INJECTED. No DATABASE_URL is required.
      - name: Janitorial + trucking ingestion tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/sam-gov-trades.test.ts src/lib/janitorial-trucking.test.ts
      # THE NIGHTLY SAM CSV IMPORT + THE SET-ASIDE LABEL CONTRACT (engineer flag,
      # 2026-10-19). Both suites existed and passed locally but NO workflow named them,
      # so they ran nowhere — the same way runner.dedupe.test.ts went unrun for weeks.
      # DETERMINISTIC, network-free and DATABASE-FREE by construction:
      #   * sam-csv.test.ts — the nightly extract parser, csvSetAsideLabel, the
      #     close-out/update gates and the CSV-vs-4-hourly-ingest agreement, over
      #     verbatim fixture bytes; NO live S3 fetch (owner guardrail).
      #   * sam-csv-state-alert.test.ts — the per-state new-notice alert it feeds.
      #   * sam-gov-setaside.test.ts — THE REGRESSION PIN for the shipped bug that
      #     mapped SAM's Total Small Business code "SBA" to "8(a)" (4,134 stored rows,
      #     migration 065): every SetASideCode -> SetASide pair measured in the
      #     2026-10-18 nightly extract is asserted here, plus "8A" -> 8(a) and
      #     "8AN" -> 8(a) sole source.
      #   * sam-set-aside-migration.test.ts — migration 065's own rule (two UPDATE
      #     statements, the 100-row exception list, the frozen cut-off that makes a
      #     re-run a no-op), read straight out of the shipped .sql file.
      - name: SAM nightly CSV import + set-aside label contract tests (unit, deterministic, zero network)
        run: bun test src/jobs/sam-csv.test.ts src/jobs/sam-csv-state-alert.test.ts src/jobs/sources/sam-gov-setaside.test.ts src/jobs/sam-set-aside-migration.test.ts
      # Nationwide correctness FIX ④ (owner-locked scope, PR B2) — per-pass
      # outcome accounting + honest zero-yield trucking passes. DETERMINISTIC,
      # network-free and DATABASE-FREE by construction:
      #   * pass-outcome.test.ts — the outcome classifier (pure function over the
      #     persisted `collector_run_log` counters; `all_skipped` / `zero_empty` /
      #     `data_error` / `suppressed_duplicate` / `ok`, plus the CRITICAL
      #     `duplicate_notice` count from PR B1's run-level guard). Every record it
      #     asserts on is a real production run-log row quoted in the file.
      #   * sam-gov-trades.test.ts already runs in the step above and now also
      #     holds the fix-④ pins (the verbatim 484110/484121/484122 pages, SAM's
      #     own `page.totalElements`, and the `TradeResponseShapeError` that stops
      #     an unreadable payload from reading as a clean zero).
      # Listed EXPLICITLY because a new deterministic suite that no workflow names
      # runs nowhere (the reason runner.dedupe.test.ts went unrun for weeks).
      - name: Nationwide correctness B2 pass-outcome tests (unit, deterministic, zero network)
        run: bun test src/jobs/pass-outcome.test.ts
      # Hauling leads — trucking queue item #4 (owner-endorsed definition R, 2026-10-16):
      # the federal-award-derived "may need hauling" ladder that feeds the /subcontracts
      # section. DETERMINISTIC and network-free by construction: every byte it reads is a
      # verbatim USAspending capture (src/lib/fixtures/hauling-leads/lexicon-slice.json,
      # see that directory's README for the capture date + the sha256 of the rows array),
      # the ladder and the field classifiers are PURE functions, and there is no
      # DATABASE_URL, no clock and no fetch. It pins every rung (119 rows -> 99 kept, with
      # the per-stage drop counts), the precomputed scope_kind/prime_kind mix, the measured
      # geography, the stored snippet/URL, and the request body the sync job sends.
      # The live half is the OPT-IN gate (src/lib/hauling-leads.source-validation.test.ts,
      # wired into `validate:live-hauling-leads`) and must never run here.
      # Named EXPLICITLY: a new deterministic suite that no workflow names runs nowhere.
      - name: Hauling leads tests (unit, deterministic, zero network)
        run: bun test src/lib/hauling-leads.test.ts
      - name: Radar return-session tests (unit, deterministic, zero network)
        run: bun test src/lib/radar-session.test.ts
      - name: Admin conversion-action tests (unit, deterministic, zero network)
        run: bun test src/lib/conversion-opportunity.test.ts
      # PR-1 RESTRUCTURE — source-provenance class map (owner-APPROVED policy,
      # plan rev 315). DETERMINISTIC and network-free by construction: every input
      # is a literal or a registry constant imported from the repo, and there is
      # no DATABASE_URL. Pins (a) the class map covers every registry label and
      # the derived federal set is the policy's 66, (b) each owner ruling maps to
      # exactly one class (va_evirginia federal + VA scope flag, pennbid STATE(PA),
      # the 51 state-name doors federal, cities federal, chicago/sf/austin local +
      # award, nys_socrata retired, INTERNAL renders no badge), (c) the
      # certification rule-3 defect BEFORE/AFTER (a NULL federal set-aside must
      # never enter the Small-Business pool while a genuine state/local one still
      # does), and (d) the award-exclusion predicate + SQL fragment.
      # Listed EXPLICITLY because a new deterministic suite that no workflow names
      # runs nowhere (the reason runner.dedupe.test.ts went unrun for weeks).
      # PR #430 (classifier-order, the PR-1 successor) appends the S3 write-path-
      # geography mirror pins (src/lib/location-foreign-pop.test.ts) to this step's
      # file list. Same determinism posture: pure functions over literals, zero
      # network, zero database, zero clock — and a new deterministic suite that no
      # workflow names runs nowhere.
      - name: Ohio local source (Worthington, Franklin County) and local page tests
        run: bun test src/jobs/sources/oh-worthington.test.ts src/jobs/sources/oh-franklin-county.test.ts src/jobs/sources/nj-harrison.test.ts src/lib/local-agencies.test.ts
      - name: Vercel cron → daily emails dispatch tests (unit, deterministic, zero network)
        run: bun test src/lib/cron-dispatch.test.ts src/lib/ci-db-lock.test.ts
      - name: USAspending federal trade data tests (unit, deterministic, zero network)
        run: bun test src/lib/federal-trade-data.test.ts
      - name: Source provenance class map tests (unit, deterministic, zero network)
        run: bun test src/lib/source-class.test.ts src/lib/location-foreign-pop.test.ts src/lib/place-of-performance.test.ts
      # D14 CORPUS-LABEL ALARM — the post-PR-1 metrics layer (owner-locked order
      # step "metrics"; measurement only, no classifier-order product change).
      # DETERMINISTIC and network-free by construction: the helper is PURE and reads
      # only the committed class map, and there is no DATABASE_URL. Pins the alarm
      # contract the runner logs on EVERY run — every `bids.source` label that
      # resolves to INTERNAL is named with the row count it affects, an
      # UNCLASSIFIED label (the C7 fail-closed reversal) is flagged, federal /
      # state / local labels are never flagged, and the success form is the
      # zero-INTERNAL shape. Listed EXPLICITLY because a new deterministic suite
      # that no workflow names runs nowhere (runner.dedupe.test.ts is still in that
      # state).
      - name: D14 corpus-label alarm tests (unit, deterministic, zero network)
        run: bun test src/jobs/runner-label-alarm.test.ts
      # Ohio Phase 3 — City of Dayton connector (owner-locked order step ②, 2026-09-23).
      # DETERMINISTIC and network-free by construction: every byte it reads is a
      # VERBATIM full-page fixture captured from the official City of Dayton board on
      # 2026-09-23 (src/jobs/sources/fixtures/dayton/, incl. the real
      # `?showAllBids=true&Status=all` empty-list response), and the parse is a PURE
      # function. No DATABASE_URL. This suite is listed EXPLICITLY because a new
      # deterministic suite that no workflow names runs nowhere (the reason
      # runner.dedupe.test.ts went unrun for weeks). It also pins the source
      # registration (TAIL_SOURCES 6→7, SOURCE_HOME_JURISDICTIONS oh_dayton→OH,
      # the non-federal "City" badge) that nothing else in CI covers.
      - name: City of Dayton connector tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/oh-dayton.test.ts
      # SDDOT highway bid lettings (sd_dot) — the first South Dakota source
      # (owner 2026-10-12): the state's central procurement portal is a ServiceNow
      # SPA publishing no dated solicitation records, so the SD source is SDDOT's
      # own server-rendered letting site. DETERMINISTIC and network-free by
      # construction: every byte comes from a committed capture of the live pages
      # (src/jobs/sources/fixtures/sd-dot/, sha256-indexed in its README) and the
      # parse is a PURE function. No DATABASE_URL. It also pins the registration
      # (TAIL_SOURCES +1, SOURCE_CLASSES +1, sd_dot → state/SD) that
      # src/lib/source-class.test.ts counts, and the date-only deadline rule.
      - name: SDDOT lettings connector tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/sd-dot.test.ts
      # BidNet Direct South Dakota Purchasing Group (sd_bidnet) — SD's
      # GENERAL-procurement surface, the complement to sd_dot above: the state's
      # own portal publishes no dated records, so the public aggregator listing is
      # the only other dated SD bid surface. THIRD-PARTY aggregator, read through
      # its public login-free open-bids list only. DETERMINISTIC and network-free
      # by construction: every byte comes from a committed capture of the live list
      # pages (src/jobs/sources/fixtures/sd-bidnet/, sha256-indexed in its README),
      # the parse is a PURE function and the ONE fetch the pagination loop makes is
      # STUBBED from those same bytes. No DATABASE_URL. It also pins the
      # registration (TAIL_SOURCES 82→83, SOURCE_CLASSES 157→158, sd_bidnet →
      # state/SD) that src/lib/source-class.test.ts counts, the fail-closed shape
      # gates (a reshape, and a heading claiming rows the parse did not deliver),
      # the members-only cells never being claimed, and the Eastern-time
      # date-only deadline rule.
      - name: BidNet South Dakota connector tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/sd-bidnet.test.ts
      # BidNet Direct New Hampshire Purchasing Group (nh_bidnet) — NH's ONLY readable
      # bid surface: every nh.gov host (DAS Bureau of Purchase and Property, NHDOT
      # lettings, legacy das.nh.gov) answers HTTP 403 to ingestion, so the official
      # portal is UNVERIFIED and is NOT faked; the public aggregator listing is what
      # ships. THIRD-PARTY aggregator, read through its public login-free open-bids
      # list only. DETERMINISTIC and network-free by construction: every byte comes
      # from a committed capture of the live list pages
      # (src/jobs/sources/fixtures/nh-bidnet/, sha256-indexed in its README), the
      # parse is a PURE function and the ONE fetch the pagination loop makes is
      # STUBBED from those same bytes. No DATABASE_URL. It also pins the
      # registration (TAIL_SOURCES 92→93, SOURCE_CLASSES 169→170, nh_bidnet →
      # state/NH) that src/lib/source-class.test.ts counts, the honest 91-listed →
      # 90-accepted accounting (one row prints "Not Available" for its closing date
      # and is skipped rather than given an invented deadline), the fail-closed shape
      # gates (a reshape, and a heading claiming rows the parse did not deliver), the
      # members-only cells never being claimed, and the Eastern-time date-only
      # deadline rule.
      - name: BidNet New Hampshire connector tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/nh-bidnet.test.ts
      # BidNet Direct Virginia & DC Purchasing Group (va_bidnet) — the THIRD config
      # of the same engine, and the complementary GENERAL-procurement surface next to
      # Virginia's own portal (`va_eva`, the Commonwealth's eVA) and the federal SAM
      # pass scoped to Virginia (`va_evirginia`) — it is neither of those and its own
      # `vabidnet-` prefix keeps the three apart. BidNet denied Contrax API access
      # 2026-10-20; the product only ever needed its PUBLIC, login-free open-bids
      # list, so THIRD-PARTY aggregator, public pages only. DETERMINISTIC and
      # network-free by construction: every byte comes from a committed capture of
      # the live list pages (src/jobs/sources/fixtures/va-bidnet/, sha256-indexed in
      # its README), the parse is a PURE function and the ONE fetch the pagination
      # loop makes is STUBBED from those same bytes. No DATABASE_URL. It also pins
      # the registration (TAIL_SOURCES 97→98, SOURCE_CLASSES 174→175, va_bidnet →
      # state/VA) that src/lib/source-class.test.ts counts, the thousands-comma
      # heading total ("1,176 Open Solicitations"), the page cap covering the 48
      # pages the group advertises today, per-row region text (District of Columbia
      # rows stay DC, Virginia rows stay VA), the fail-closed shape gates (a
      # reshape, and a heading claiming rows the parse did not deliver), the
      # members-only cells never being claimed, and the Eastern-time date-only
      # deadline rule.
      - name: BidNet Virginia & DC connector tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/va-bidnet.test.ts
      # BidNet Direct California Purchasing Group (ca_bidnet) — the FOURTH config
      # of the same engine, and the complementary GENERAL-procurement surface next
      # to California's own portal (`ca_eprocure`, Cal eProcure) — it is not that
      # portal, and its own `cabidnet-` prefix keeps the two apart. THIRD-PARTY
      # aggregator, public login-free open-bids pages only. This is the LARGEST
      # group the engine reads: 2,468 open solicitations over 99 pages on
      # 2026-10-21 (vs SD 2, NH 4, VA 48), so its config raises BOTH the page cap
      # (150) and its own per-pass abort (240 s; the engine default stays 120 s for
      # the other three) — and a pass that overruns still FAILS CLOSED rather than
      # reporting a partial group. DETERMINISTIC and network-free by construction:
      # every byte comes from a committed capture of the live list pages
      # (src/jobs/sources/fixtures/ca-bidnet/, sha256-indexed in its README), the
      # parse is a PURE function and the ONE fetch the pagination loop makes is
      # STUBBED from those same bytes. No DATABASE_URL. It also pins the
      # registration (TAIL_SOURCES 98→99, SOURCE_CLASSES 175→176, ca_bidnet →
      # state/CA) that src/lib/source-class.test.ts counts, the thousands-comma
      # heading total ("2,468 Open Solicitations"), the page cap AND the pass
      # budget covering the 99 pages the group advertises today, per-row region
      # text (every row keeps `California`), the fail-closed shape gates (a
      # reshape, and a heading claiming rows the parse did not deliver), the
      # members-only cells never being claimed, and the Eastern-time date-only
      # deadline rule.
      - name: BidNet California connector tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/ca-bidnet.test.ts
      # BidNet Direct Empire State Purchasing Group (ny_bidnet) — the FIFTH config
      # of the same engine, next to New York's own board (`ny_nyscr`). Its rows
      # link with BidNet's second detail-URL shape (`/new-york/solicitations/
      # open-bids/<title-slug>/<id>`), which the engine's `bidNetDetailId` reads
      # alongside the SD/NH/VA/CA `/public/supplier/…/abstract` shape.
      # DETERMINISTIC and network-free: every byte comes from the committed
      # captures in src/jobs/sources/fixtures/ny-bidnet/; no DATABASE_URL.
      - name: BidNet New York connector tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/ny-bidnet.test.ts
      # BidNet Direct Florida Purchasing Group (fl_bidnet) — the SIXTH config, next
      # to Florida's own board (`fl_mfmp`); same link shape and treatment as
      # ny_bidnet. Committed captures only (fixtures/fl-bidnet/); no DATABASE_URL.
      - name: BidNet Florida connector tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/fl-bidnet.test.ts
      # BidNet Direct North Carolina Purchasing Group (nc_bidnet) — the SEVENTH
      # config, next to North Carolina's own board (`nc_evp`); a one-page group.
      # Committed capture only (fixtures/nc-bidnet/); no DATABASE_URL.
      - name: BidNet North Carolina connector tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/nc-bidnet.test.ts
      # BidNet Direct Texas / Ohio / Pennsylvania Purchasing Groups (tx_bidnet,
      # oh_bidnet, pa_bidnet) — the EIGHTH to TENTH configs, each next to the
      # state's own board and each past the default page cap (77 / 59 / 51 pages
