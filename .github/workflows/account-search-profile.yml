name: Account Search Profile

# Read-only lookup (owner 2026-10-19): print one account's plan and saved
# onboarding profile (trade, states, NAICS) so we can see what a signed-in
# visitor was searching for. Run by hand from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Account email, or the part before @"
        type: string
        required: true

permissions:
  contents: read

jobs:
  report:
    name: Account search profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMAIL: ${{ inputs.email }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Print the profile
        run: bun run account-search-profile
