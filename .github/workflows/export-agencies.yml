name: Export Agencies
# One-off database export tool — dumps the distinct agency list from the
# production `bids` table to agencies.csv and uploads it as an artifact.
#
# Manual trigger only (no schedule, no push). The production DATABASE_URL is
# a GitHub Actions secret, so the export runs here on the runner rather than
# in the sandbox (which has no DB credentials).
#
# Required secret:
#   DATABASE_URL — Neon Postgres connection string (same value as the Vercel
#                  project env var and the sync-bids workflow). REQUIRED; the
#                  run fails without it.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    name: Export distinct agencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run agency export
        run: bun run scripts/export-agencies.ts
      - name: Upload agencies CSV
        uses: actions/upload-artifact@v4
        with:
          name: agencies-export
          path: agencies.csv
          retention-days: 7
