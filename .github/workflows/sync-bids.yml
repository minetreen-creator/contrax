name: Sync Bids

# Bid sync moved off Vercel Cron (Hobby 10s function cap kills a 6–15 min
# sync). It now runs here on GitHub Actions, where the job can run for up to
# 6 hours and is free on public repos.
#
# Required secrets (owner must set in GitHub repo settings → Secrets):
#   DATABASE_URL   — Neon Postgres connection string (same value as the Vercel
#                    project env var). REQUIRED; the run fails without it.
#   RESEND_API_KEY — optional; enables the bid digest email (skipped with a
#                    warning when absent).

on:
  schedule:
    # Every 4 hours, every day (incl. weekends), UTC. The homepage's "Newest
    # solicitations" section shows a rolling 24-hour window, so weekend
    # visitors must see fresh solicitations too — weekdays-only left the
    # section empty from Fri evening UTC until Mon's first run. 42 runs/week
    # on SAM.gov's public API is still modest (30 on weekdays before; 6 extra
    # per weekend day), and the API rate stays identical within each day.
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: sync-bids
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Run bid sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bid sync
        run: bun run sync-bids

      - name: Run non-zero incumbent watch (post-sync)
        # Diagnostic (scripts/watch-nonzero-incumbents.ts, PR #236): scans open
        # set-aside bids and records any whose real prior award (getFPDSIntel)
        # is non-zero — a live /radar free-match "PREVIOUS WINNER & AWARD PRICE"
        # demo candidate. Runs here, after the sync in the same job, so it sees
        # the just-synced bids and reuses this job's DATABASE_URL seam (no new
        # secrets). It is bounded/sequential and dedupes across runs, so it is
        # safe and lightweight. Marked non-fatal so a diagnostic hiccup never
        # fails the actual bid sync itself.
        run: bun run scripts/watch-nonzero-incumbents.ts
        continue-on-error: true
