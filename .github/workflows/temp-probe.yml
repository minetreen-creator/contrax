name: Temp probe press
on:
  push:
    branches: [claude/vibrant-cray-177q1d]
    paths: [".github/probe/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Federal construction awards (USAspending)
        run: python3 .github/probe/usa.py tri; python3 .github/probe/usa.py rva
      - name: Newsroom contacts
        run: bun .github/probe/news.ts
