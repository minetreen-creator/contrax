name: Funnel Report

# Read-only report (owner 2026-10-19): visitors → search → signup → pricing →
# upgrade over the last N days, to find the step that loses the most people.
# Prints counts only. Run by hand from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        type: number
        default: 30

permissions:
  contents: read

jobs:
  report:
    name: Funnel report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DAYS: ${{ inputs.days }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Print the report
        run: bun run funnel-report
