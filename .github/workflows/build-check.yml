name: Build Check
# Deploy-blocking build gate: reproduces the Vercel prebuilt pipeline
# (build-vercel.sh -> .vercel/output) and validates the Build Output API
# bundle BEFORE merge, so a broken prod build can never reach production.
# Order matters:
#   1. frozen-lockfile install
#   2. route JSX syntax check (faill fast on malformed TSX)
#   3. build .vercel/output (vite build + vercel-entry bundle) — this also
#      GENERATES src/routeTree.gen.ts
#   4. prod-config typecheck AFTER route generation (routeTree.gen.ts must
#      exist first — never typecheck before it) — BASELINE-DELTA GATE
#      (owner-approved, PR #375): a committed 56-error baseline
#      (.github/typecheck-baseline.txt) lists origin/main's PRE-EXISTING
#      prod-config type errors; the job prints the CURRENT error count + an
#      explicit unified diff vs the baseline and FAILS on added lines (new
#      errors) AND on removed lines (visible baseline mismatch requiring a
#      deliberate baseline-file update). Pass note wording: "56 pre-existing
#      baseline + delta gate — PASS ..." — never "typecheck-clean".
#      noUnusedLocals/noUnusedParameters remain true in tsconfig.prod.json.
#   5. Build Output API validation (config.json v3, nodejs22.x, render bundle
#      <= 12 MB)
#   6. bundled request-context integration test against the ASSEMBLED render
#      function (executes .vercel/output/functions/render.func/index.mjs —
#      concurrent request isolation, authenticated SSR via the global accessor
#      registry, error-cleanup, per-request IP). DB-dependent cases run when
#      DATABASE_URL is present and are explicitly skipped otherwise.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Typecheck (post-build) + bundle validation + integration test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Route JSX syntax check
        run: bun run check:routes
      - name: Build .vercel/output (Build Output API v3)
        run: bash build-vercel.sh
      - name: Typecheck (prod config) — 56 pre-existing baseline + delta gate
        shell: bash
        run: |
          set -euo pipefail
          # Owner-approved baseline-delta gate (PR #375): origin/main carries a
          # committed 56-error baseline (.github/typecheck-baseline.txt) of
          # PRE-EXISTING prod-config type errors (noUnusedLocals /
          # noUnusedParameters stay true in tsconfig.prod.json). This step:
          #   - prints the CURRENT error count;
          #   - prints an explicit unified diff of the current error lines vs the
          #     baseline (added lines = NEW errors, removed lines = a baseline
          #     mismatch that must surface as a visible diff requiring a
          #     DELIBERATE baseline-file update);
          #   - FAILS on BOTH directions — never a silent pass, never described
          #     as typecheck-clean. The separate type-debt PR absorbs the 56 and
          #     updates the baseline in the same commit (flipping this gate to a
          #     real 0-delta-vs-0 baseline).
          bun run typecheck > /tmp/typecheck-current.txt 2>&1 || true
          grep -E 'error TS[0-9]+' /tmp/typecheck-current.txt | sort -u > /tmp/typecheck-current-lines.txt || true
          sort -u .github/typecheck-baseline.txt > /tmp/typecheck-baseline-lines.txt
          COUNT=$(wc -l < /tmp/typecheck-current-lines.txt)
          echo "--- current prod-config typecheck error lines: ${COUNT} ---"
          echo "--- unified diff vs .github/typecheck-baseline.txt (56 pre-existing baseline; '-' = baseline-only line, '+' = current-only line) ---"
          set +e
          diff -u /tmp/typecheck-baseline-lines.txt /tmp/typecheck-current-lines.txt
          DIFF_RC=$?
          set -e
          if [ "$DIFF_RC" -ne 0 ]; then
            echo "::error::Typecheck delta vs the committed 56-error baseline detected — see the unified diff above (added lines = new errors; removed lines = baseline mismatch requiring a deliberate baseline-file update). Failing."
            exit 1
          fi
          echo "56 pre-existing baseline + delta gate — PASS (current error lines: ${COUNT}; delta vs committed baseline: 0)"
      - name: Validate .vercel/output bundle
        run: |
          set -euo pipefail
          test -f .vercel/output/config.json || { echo "missing config.json"; exit 1; }
          grep -q '"version": 3' .vercel/output/config.json || { echo "config.json version != 3"; exit 1; }
          test -f .vercel/output/functions/render.func/.vc-config.json || { echo "missing render.func/.vc-config.json"; exit 1; }
          grep -q 'nodejs22.x' .vercel/output/functions/render.func/.vc-config.json || { echo "vc-config runtime != nodejs22.x"; exit 1; }
          SIZE=$(stat -c%s .vercel/output/functions/render.func/index.mjs)
          echo "render.func/index.mjs size: $SIZE bytes"
          TOTAL=$(du -sb .vercel/output | cut -f1)
          echo ".vercel/output total bytes: $TOTAL"
          if [ "$SIZE" -gt $((12 * 1024 * 1024)) ]; then
            echo "FAIL: render function bundle exceeds 12 MB ceiling ($SIZE bytes)"
            exit 1
          fi
          echo "bundle validation OK"
      - name: Bundled request-context integration test (assembled render function)
        run: bun test tests/request-context.bundled.test.ts
      # Homepage cache policy (owner-approved F1, 2026-09-21). Deterministic,
      # zero network, no DATABASE_URL: it asserts the public SSR edge-cache
      # allowlist never contains `/` (the session-dependent front door that was
      # serving cached signed-out HTML to signed-in visitors), that the other
      # cookie-agnostic marketing routes stay cached, and that the launcher
      # delegates to the policy module instead of re-inlining a `/` rule.
      - name: Homepage cache policy tests (unit, deterministic, zero network)
        run: bun test src/lib/ssr-cache-policy.test.ts
      # HOMEPAGE GRANTS PLUS FAIL-SAFE (owner directive rev 327, 2026-09-23).
      # DETERMINISTIC and network-free by construction: every input is a literal,
      # the tier table is rendered to static markup in-process (react-dom/server),
      # and there is no DATABASE_URL, no clock, no fetch and no Stripe symbol. It
      # pins the directive's three paths — normal (flag on ⇒ the launched
      # "Get Grants Plus →" → /grants row, byte-for-byte, and zero "Coming soon"),
      # fallback (flag off/absent ⇒ the row's CTA is plain non-interactive text
      # with NO href/button/payment link), and fail-closed (absent/garbage/throwing
      # env ⇒ disabled; the loader reads the flag once, server-side, and the other
      # two tier rows are never gated). Listed EXPLICITLY because a new
      # deterministic suite that no workflow names runs nowhere (the reason
      # runner.dedupe.test.ts went unrun for weeks).
      - name: Homepage grants fail-safe tests (unit, deterministic, zero network)
        run: bun test tests/homepage-grants-failsafe.test.tsx
      # Nonprofit Free (owner green-lit 2026-09-21, six-point spec). The phase-1 unit
      # suite is DETERMINISTIC and network-free by construction: every IRS byte it reads is
      # a verbatim fixture committed to src/lib/fixtures/irs/, and the store is injected —
      # so it needs no DATABASE_URL and is safe on every PR. Without this step the
      # nonprofit code would have no test coverage in CI at all.
      - name: Nonprofit Free tests (unit, deterministic, zero network)
        run: bun test src/lib/nonprofit-free.test.ts
      # Nonprofit Free phase 2 (unit A + unit B, owner green-lit 2026-09-21). The always-on
      # half is deterministic and database-free: migration 046 ↔ src/db/schema.sql mirror
      # assertions, the apply flow's order of operations (a malformed EIN writes nothing, a
      # duplicate EIN never reaches the engine), the released-EIN claim semantics, the
      # writer's decision → audit-column mapping and the copy rules; plus unit B's review
      # queue (the four guarded transitions, the 0-row guard ⇒ 409, one append-only audit row
      # per action, the SLA clock, the reviewer projection's minimality and the amended
      # request_info CHECK). The DB half is OPT-IN and runs only when the repo has a
      # DATABASE_URL secret: it builds a throwaway database from src/db/schema.sql ALONE and
      # drops it again — the same discipline as the state-grants bootstrap test — to prove
      # the PARTIAL unique index on `ein` really makes a released EIN claimable and that the
      # guarded UPDATE + audit INSERT behave as the owner's locks require. Migration 046's
      # hand-run runner is never invoked here (deliberate: it must not be reachable from CI).
      - name: Nonprofit Free phase 2 tests (unit + schema bootstrap when available)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NONPROFIT_TEST_PROVISION_SCHEMA: "1"
        run: |
          set -uo pipefail
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL present — the phase-2 schema bootstrap suites will build throwaway databases from src/db/schema.sql."
          else
            echo "DATABASE_URL secret NOT configured — the phase-2 bootstrap suites skip loudly (the unit half still must pass)."
          fi
          bun test src/lib/nonprofit-apply.test.ts src/lib/nonprofit-apply.integration.test.ts src/lib/nonprofit-review.test.ts src/lib/nonprofit-review.integration.test.ts
      # Janitorial + trucking ingestion (owner PRIORITY 09-21, R1–R4). DETERMINISTIC
      # and network-free by construction: every SAM.gov byte these suites read is a
      # committed fixture captured from the official API
      # (src/jobs/sources/fixtures/sam-trades/), and the per-opportunity detail
      # fetcher is INJECTED. No DATABASE_URL is required.
      - name: Janitorial + trucking ingestion tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/sam-gov-trades.test.ts src/lib/janitorial-trucking.test.ts
      # Nationwide correctness FIX ④ (owner-locked scope, PR B2) — per-pass
      # outcome accounting + honest zero-yield trucking passes. DETERMINISTIC,
      # network-free and DATABASE-FREE by construction:
      #   * pass-outcome.test.ts — the outcome classifier (pure function over the
      #     persisted `collector_run_log` counters; `all_skipped` / `zero_empty` /
      #     `data_error` / `suppressed_duplicate` / `ok`, plus the CRITICAL
      #     `duplicate_notice` count from PR B1's run-level guard). Every record it
      #     asserts on is a real production run-log row quoted in the file.
      #   * sam-gov-trades.test.ts already runs in the step above and now also
      #     holds the fix-④ pins (the verbatim 484110/484121/484122 pages, SAM's
      #     own `page.totalElements`, and the `TradeResponseShapeError` that stops
      #     an unreadable payload from reading as a clean zero).
      # Listed EXPLICITLY because a new deterministic suite that no workflow names
      # runs nowhere (the reason runner.dedupe.test.ts went unrun for weeks).
      - name: Nationwide correctness B2 pass-outcome tests (unit, deterministic, zero network)
        run: bun test src/jobs/pass-outcome.test.ts
      - name: Radar return-session tests (unit, deterministic, zero network)
        run: bun test src/lib/radar-session.test.ts
      - name: Admin conversion-action tests (unit, deterministic, zero network)
        run: bun test src/lib/conversion-opportunity.test.ts
      # PR-1 RESTRUCTURE — source-provenance class map (owner-APPROVED policy,
      # plan rev 315). DETERMINISTIC and network-free by construction: every input
      # is a literal or a registry constant imported from the repo, and there is
      # no DATABASE_URL. Pins (a) the class map covers every registry label and
      # the derived federal set is the policy's 66, (b) each owner ruling maps to
      # exactly one class (va_evirginia federal + VA scope flag, pennbid STATE(PA),
      # the 51 state-name doors federal, cities federal, chicago/sf/austin local +
      # award, nys_socrata retired, INTERNAL renders no badge), (c) the
      # certification rule-3 defect BEFORE/AFTER (a NULL federal set-aside must
      # never enter the Small-Business pool while a genuine state/local one still
      # does), and (d) the award-exclusion predicate + SQL fragment.
      # Listed EXPLICITLY because a new deterministic suite that no workflow names
      # runs nowhere (the reason runner.dedupe.test.ts went unrun for weeks).
      # PR #430 (classifier-order, the PR-1 successor) appends the S3 write-path-
      # geography mirror pins (src/lib/location-foreign-pop.test.ts) to this step's
      # file list. Same determinism posture: pure functions over literals, zero
      # network, zero database, zero clock — and a new deterministic suite that no
      # workflow names runs nowhere.
      - name: Source provenance class map tests (unit, deterministic, zero network)
        run: bun test src/lib/source-class.test.ts src/lib/location-foreign-pop.test.ts
      # D14 CORPUS-LABEL ALARM — the post-PR-1 metrics layer (owner-locked order
      # step "metrics"; measurement only, no classifier-order product change).
      # DETERMINISTIC and network-free by construction: the helper is PURE and reads
      # only the committed class map, and there is no DATABASE_URL. Pins the alarm
      # contract the runner logs on EVERY run — every `bids.source` label that
      # resolves to INTERNAL is named with the row count it affects, an
      # UNCLASSIFIED label (the C7 fail-closed reversal) is flagged, federal /
      # state / local labels are never flagged, and the success form is the
      # zero-INTERNAL shape. Listed EXPLICITLY because a new deterministic suite
      # that no workflow names runs nowhere (runner.dedupe.test.ts is still in that
      # state).
      - name: D14 corpus-label alarm tests (unit, deterministic, zero network)
        run: bun test src/jobs/runner-label-alarm.test.ts
      # Ohio Phase 3 — City of Dayton connector (owner-locked order step ②, 2026-09-23).
      # DETERMINISTIC and network-free by construction: every byte it reads is a
      # VERBATIM full-page fixture captured from the official City of Dayton board on
      # 2026-09-23 (src/jobs/sources/fixtures/dayton/, incl. the real
      # `?showAllBids=true&Status=all` empty-list response), and the parse is a PURE
      # function. No DATABASE_URL. This suite is listed EXPLICITLY because a new
      # deterministic suite that no workflow names runs nowhere (the reason
      # runner.dedupe.test.ts went unrun for weeks). It also pins the source
      # registration (TAIL_SOURCES 6→7, SOURCE_HOME_JURISDICTIONS oh_dayton→OH,
      # the non-federal "City" badge) that nothing else in CI covers.
      - name: City of Dayton connector tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/oh-dayton.test.ts
      # eVA — Virginia's procurement portal (va_eva), the state + LOCAL source for
      # Virginia (owner spec 2026-10-08). DETERMINISTIC and network-free by
      # construction: every byte it reads is a committed capture of the live Solr
      # proxy (src/jobs/sources/fixtures/va-eva/, sha256-indexed in its README), the
      # parse is a PURE function, and the ONE fetch it exercises is stubbed from
      # those same bytes. No DATABASE_URL. It pins, on real bytes:
      #   · the OPEN-SET SCOPE — `EVA_OPEN_QUERY` is asserted VERBATIM
      #     (`app:IV AND status:Open AND closedate:[NOW TO *]`), and the one
      #     ARCHIVED `app:VBO` row that still says status:Open is refused
      #     (`wrong_app`) so a frozen-2023 notice can never enter as open;
      #   · the COUNT GATE — documents read must equal the source's own `numFound`,
      #     `numFound = 0` is refused, and a set that moves mid-read is refused
      #     (including the REAL partial page: 25 docs vs numFound 572);
      #   · the 5-byte malformed-query body (HTTP 200, not an error) fails CLOSED;
      #   · the CLOSE-DATE RULE — `due_date` is exactly what eVA published, never
      #     shifted to/from Eastern (owner-noted unresolved `Z`-on-an-ET-source
      #     quirk), with no countdown label for these rows;
      #   · the honest `VA_EVA_COPY` (no trade-coverage claim — the 2026-10-08 probe
      #     measured ZERO courier/freight/trucking rows among 574 open) and the
      #     source registration (TAIL_SOURCES, SOURCE_HOME_JURISDICTIONS → VA, the
      #     non-federal "State (VA)" badge) that nothing else in CI covers.
      # The live half is the OPT-IN gate (va-eva.source-validation.test.ts, wired
      # into `validate:live-bids-sources`) and must never run here.
      # Named EXPLICITLY: this suite was referenced by NO workflow before this PR,
      # which is the same way runner.dedupe.test.ts went unrun for weeks.
      - name: Virginia eVA connector tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/va-eva.test.ts
      # The SHARED CivicEngage / CivicPlus bid-board reader (civicengage-bids.ts) and
      # the four Virginia locality boards built on it (va_loudoun · va_suffolk ·
      # va_lynchburg · va_charlottesville — owner green-light 2026-10-08, dispatch A).
      # DETERMINISTIC, zero network, no DATABASE_URL, and deliberately NO
      # `mock.module` (bun's mock registry is process-global and leaks across test
      # files in one run — the #613/#588/#591 standard): every byte read is a
      # committed capture of the live boards (src/jobs/sources/fixtures/{loudoun,
      # suffolk,lynchburg,charlottesville}/, sha256-indexed in each README) and the
      # ONE fetch path is exercised through an in-process `globalThis.fetch` stub
      # built from those same bytes. It pins, on real bytes:
      #   · the BARE-URL rule — a query-param endpoint is refused at CONFIG load,
      #     and the real `?showAllBids=true&Status=all` capture (HTTP 404, no item
      #     container on all four boards) parses to ZERO rows + `{shape_change: 1}`
      #     instead of a plausible-but-empty board;
      #   · the two div.bidStatus child divs (labels vs VALUES — the naive read
      #     returns the text "Status:"), the OPTIONAL `Bid No.` line, alternating
      #     row classes, and the "Read on" affordance stripped on EITHER spelling
      #     (Dayton writes `Read&nbsp;on`, these boards a plain `Read on`) with the
      #     mixed entities (&ldquo;/&rsquo;/&mdash;) decoded;
      #   · "parse or NULL" — a non-date `Closes:` value ("Upon Contract" is the
      #     open-ended state these boards print) → due_date null and the row is
      #     STILL emitted; a genuinely past-due row is dropped as `closed` through
      #     the INJECTED reference instant (no wall-clock dependence);
      #   · all four fail-closed fetch gates (non-2xx · body < 5 000 bytes ·
      #     missing item-region anchors · transport failure) throwing
      #     SourceUnreachableError (DEAD) rather than reading as an honest zero;
      #   · HONEST DATA — agency/location/ids come from the board CONFIG (a config
      #     deliberately disagreeing with the bytes it parses proves it), set_aside
      #     is NULL unless the row's own text states a program, and naics/psc/
      #     notice_type/solicitation_number stay NULL;
      #   · the registration that nothing else in CI covers (TAIL_SOURCES,
      #     SOURCE_CLASSES LOCAL + city badge + `city-open-data`, the VA home
      #     jurisdiction and the non-federal badge).
      # The live half is the OPT-IN gate (va-{loudoun,suffolk,lynchburg,
      # charlottesville}.source-validation.test.ts, wired into
      # `validate:live-bids-sources`) and must never run here.
      # Named EXPLICITLY: a deterministic suite that no workflow names runs nowhere
      # (the reason runner.dedupe.test.ts went unrun for weeks).
      - name: CivicEngage shared bid-board reader tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/civicengage-bids.test.ts
      - name: Virginia locality CivicEngage board tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/va-loudoun.test.ts src/jobs/sources/va-suffolk.test.ts src/jobs/sources/va-lynchburg.test.ts src/jobs/sources/va-charlottesville.test.ts
      # Zone-unverified countdown suppression (owner 2026-10-08, Virginia drive). The
      # helper suite also derives the flag-bearing connector set from src/jobs + runner.ts,
      # so a future connector that mints a *_DUE_DATE_ZONE_UNVERIFIED flag but forgets
      # src/lib/deadline-label.ts turns THIS step red.
      # The same step runs the RAW-DATE render gate suite (owner follow-up, 2026-10-08):
      # the six surfaces that print a bid's close date VERBATIM must render a flagged
      # source's date in UTC ("Oct 15", not the reader-shifted "Oct 14"), and every
      # unflagged/NULL source must keep its existing output byte-for-byte. In-process
      # react-dom/server renders of the real components + literal/source pins:
      # deterministic, network-free, no DATABASE_URL, no clock.
      - name: Deadline-label countdown + ICS alarm + raw published-date render tests (unit, deterministic, zero network)
        run: bun test src/lib/deadline-label.test.ts src/lib/calendar-feed-suppression.test.ts tests/deadline-label-raw-render.test.tsx
      # Virginia locality BONFIRE portals (va_fairfax_bonfire · va_alexandria_bonfire —
      # owner green-light 2026-10-08, dispatch B), built as TWO config entries on the
      # EXISTING shared Bonfire reader (bonfire-public.ts) that the Utah, Texas and
      # Milwaukee tenants already use. DETERMINISTIC, zero network, no DATABASE_URL,
      # and deliberately NO `mock.module` (bun's mock registry is process-global and
      # leaks across test files in one run — the #613/#588/#591 standard): every byte
      # read is a committed capture of the live tenant
      # (src/jobs/sources/fixtures/va-{fairfax,alexandria}-bonfire/, sha256-indexed in
      # each README, two byte-identical fetch pairs). It pins, on real bytes:
      #   · the captured listed/accepted counts (Fairfax 7/7, Alexandria 3/3) with ZERO
      #     skips, and the row-by-row identity the portal itself states (project id ·
      #     reference · title · department · close instant · category);
      #   · each tenant's own published shape: Fairfax's department list is EMPTY, so
      #     every row falls back to the County (no code expanded, no name invented);
      #     Alexandria DOES publish department labels and they are kept VERBATIM as
      #     `agency` ("41 - Transportation and Environmental Services (TES/DPI)");
      #   · HONEST DATA — the config literals "Fairfax County" / "City of Alexandria,
      #     VA" for agency/location, per-tenant `external_id` prefixes over Bonfire's
      #     SHARED ProjectID space (no cross-tenant collision), the absolute
      #     official-host URL, and NULL for set_aside/naics/psc/notice_type (a Bonfire
      #     public list publishes none — ruling f);
      #   · THE TIME-ZONE RULE on the wire — DateClose is the stored UTC instant and
      #     every due_date is exactly that value, never shifted into the tenant's
      #     display zone (America/Toronto on Fairfax, America/New_York on Alexandria);
      #   · the reader's gates (status · passed close · non-competition · missing
      #     fields · unreadable date) and the ADDITIVE `locationName` config field that
      #     leaves every pre-existing tenant stating its state name;
      #   · the registration nothing else in CI covers (TAIL_SOURCES, SOURCE_CLASSES
      #     LOCAL + place badge + `city-open-data`, VA home jurisdiction, non-federal
      #     badge) and the copy, which quotes the live capture counts and makes no
      #     coverage claim (and no courier/delivery claim for Fairfax, whose 7 open
      #     solicitation titles contain none).
      # The live half is the OPT-IN gate (va-{fairfax,alexandria}-bonfire.source-validation.test.ts,
      # wired into `validate:live-bids-sources`) and must never run here.
      # Named EXPLICITLY: a deterministic suite that no workflow names runs nowhere.
      - name: Virginia locality Bonfire portal tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/va-fairfax-bonfire.test.ts src/jobs/sources/va-alexandria-bonfire.test.ts
      # Wisconsin DOA VendorNet Bids (wi_vendornet) - the FIRST browser-rendered
      # source in the bids family. This suite is the PARSER half only, deterministic
      # and zero-network/zero-browser by construction: it reads ONE committed capture
      # of the live board open-only set and exercises the pure parse function
      # (identity, slug fallback, skip accounting, the fail-closed guards, the plan
      # section 4 copy). The browser half is the OPT-IN live gate
      # (wi-vendornet.source-validation.test.ts), which needs Chrome + puppeteer-core
      # and must never run here. Named EXPLICITLY: a new deterministic suite that no
      # workflow names runs nowhere.
      - name: Wisconsin VendorNet connector tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/wi-vendornet.test.ts
      # Texas Bonfire tenants (tx_txdot_bonfire, tx_uttyler_bonfire - batch 3a,
      # owner green-light 2026-10-06). DETERMINISTIC and network-free by construction:
      # every byte it reads is a committed capture of the live tenant responses
      # (src/jobs/sources/fixtures/tx-txdot-bonfire/ + fixtures/tx-uttyler-bonfire/,
      # see their READMEs) and the parse is a PURE function. No DATABASE_URL. It also
      # pins the TIME-ZONE RULE (Bonfire's zone-less DateClose is UTC - bonfire-public.ts)
      # and the source registration (TAIL_SOURCES 49 -> 51, SOURCE_CLASSES 125 -> 127,
      # SOURCE_HOME_JURISDICTIONS -> TX, the non-federal "State (TX)" badge) that nothing
      # else in CI covers. Named EXPLICITLY: a new deterministic suite that no workflow
      # names runs nowhere (the reason runner.dedupe.test.ts went unrun for weeks).
      - name: Texas Bonfire tenants tests (unit, deterministic, zero network)
        run: bun test src/jobs/sources/tx-bonfire.test.ts
      # Texas university JAGGAER tenants (tx_uh_jaggaer, tx_tamu_jaggaer,
      # tx_texastech_jaggaer, tx_utsa_jaggaer — batch 3b, owner green-light
      # 2026-10-06). DETERMINISTIC and network-free by construction: every byte it
      # reads is a committed capture of the live tenant pages
      # (src/jobs/sources/fixtures/tx-*-jaggaer/, see their READMEs), the parse is a
      # PURE function, and the ONE fetch it exercises is stubbed from those same
      # bytes. No DATABASE_URL. It pins the two page shapes the family must tolerate
      # (TAMU prints "1-21 of 21 Results"; UH, Texas Tech and UTSA print no total)
      # PLUS the count cross-check that keeps a truncated page from passing, the
      # per-tenant id prefixes, and the source registration (TAIL_SOURCES 51 -> 55,
