name: Build Check
# Deploy-blocking build gate: reproduces the Vercel prebuilt pipeline
# (build-vercel.sh -> .vercel/output) and validates the Build Output API
# bundle BEFORE merge, so a broken prod build can never reach production.
# Order matters:
#   1. frozen-lockfile install
#   2. route JSX syntax check (faill fast on malformed TSX)
#   3. build .vercel/output (vite build + vercel-entry bundle) — this also
#      GENERATES src/routeTree.gen.ts
#   4. prod-config typecheck AFTER route generation (routeTree.gen.ts must
#      exist first — never typecheck before it) — BASELINE-DELTA GATE
#      (owner-approved, PR #375): origin/main carries 56 pre-existing prod-config
#      type errors (committed list in .github/typecheck-baseline.txt); the job
#      FAILS ONLY on new/missing lines vs that baseline (prints the delta and a
#      "baseline-only (56 pre-existing)" pass note when there is no delta). Never
#      a silent pass — errors stay visible, and the separate type-debt PR absorbs
#      them (it updates the baseline in the same commit).
#      noUnusedLocals/noUnusedParameters remain true in tsconfig.prod.json.
#   5. Build Output API validation (config.json v3, nodejs22.x, render bundle
#      <= 12 MB)
#   6. bundled request-context integration test against the ASSEMBLED render
#      function (executes .vercel/output/functions/render.func/index.mjs —
#      concurrent request isolation, authenticated SSR via the global accessor
#      registry, error-cleanup, per-request IP). DB-dependent cases run when
#      DATABASE_URL is present and are explicitly skipped otherwise.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Typecheck (post-build) + bundle validation + integration test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Route JSX syntax check
        run: bun run check:routes
      - name: Build .vercel/output (Build Output API v3)
        run: bash build-vercel.sh
      - name: Typecheck (prod config) — baseline-delta gate vs committed 56-error baseline
        shell: bash
        run: |
          set -euo pipefail
          # Owner-approved baseline-delta gate (PR #375). origin/main carries 56
          # pre-existing prod-config type errors (see .github/typecheck-baseline.txt;
          # noUnusedLocals/noUnusedParameters stay true in tsconfig.prod.json).
          # This step FAILS ONLY on new/missing error lines vs the committed
          # baseline: a delta is printed and fails the job — it never silently
          # passes and never hides errors. No delta = pass, with the count
          # printed. The separate type-debt PR absorbs the 56 and updates the
          # baseline in the same commit (which flips this gate to a real
          # 0-delta-vs-0 baseline).
          bun run typecheck > /tmp/typecheck-current.txt 2>&1 || true
          grep -E 'error TS[0-9]+' /tmp/typecheck-current.txt | sort -u > /tmp/typecheck-current-lines.txt || true
          sort -u .github/typecheck-baseline.txt > /tmp/typecheck-baseline-lines.txt
          if ! diff -u /tmp/typecheck-baseline-lines.txt /tmp/typecheck-current-lines.txt; then
            echo "::error::Typecheck delta vs .github/typecheck-baseline.txt detected (see diff above — new errors introduced, or the baseline needs a deliberate update). Failing."
            exit 1
          fi
          COUNT=$(wc -l < /tmp/typecheck-current-lines.txt)
          echo "baseline-only (${COUNT} pre-existing errors) — delta gate PASS (owner-approved: no new errors vs .github/typecheck-baseline.txt)"
      - name: Validate .vercel/output bundle
        run: |
          set -euo pipefail
          test -f .vercel/output/config.json || { echo "missing config.json"; exit 1; }
          grep -q '"version": 3' .vercel/output/config.json || { echo "config.json version != 3"; exit 1; }
          test -f .vercel/output/functions/render.func/.vc-config.json || { echo "missing render.func/.vc-config.json"; exit 1; }
          grep -q 'nodejs22.x' .vercel/output/functions/render.func/.vc-config.json || { echo "vc-config runtime != nodejs22.x"; exit 1; }
          SIZE=$(stat -c%s .vercel/output/functions/render.func/index.mjs)
          echo "render.func/index.mjs size: $SIZE bytes"
          TOTAL=$(du -sb .vercel/output | cut -f1)
          echo ".vercel/output total bytes: $TOTAL"
          if [ "$SIZE" -gt $((12 * 1024 * 1024)) ]; then
            echo "FAIL: render function bundle exceeds 12 MB ceiling ($SIZE bytes)"
            exit 1
          fi
          echo "bundle validation OK"
      - name: Bundled request-context integration test (assembled render function)
        run: bun test tests/request-context.bundled.test.ts