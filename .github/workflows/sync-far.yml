name: Sync FAR/DFARS
# FAR/DFARS sync moved off Vercel Cron (Hobby 10s function cap kills a
# multi-minute 107-part sync, and the cron's CRON_SECRET bearer token was never
# accepted by /api/sync-far, so it 401'd on every run and nothing has synced
# since the Aug 8 seed bootstrap). It now runs here on GitHub Actions, where
# the job can run for up to 30 minutes and is free on public repos.
#
# Required secrets (owner must set in GitHub repo settings → Secrets):
#   DATABASE_URL   — Neon Postgres connection string (same value as the Vercel
#                    project env var). REQUIRED; the run fails without it.
on:
  schedule:
    # Daily at 06:30 UTC — matches the old Vercel cron schedule, so the corpus
    # refreshes at the same time of day it always intended to.
    - cron: "30 6 * * *"
  workflow_dispatch:
concurrency:
  group: sync-far
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    name: Run FAR/DFARS sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run FAR/DFARS sync
        run: bun run sync-far
