name: Temp look (Beacon public solicitations)
on:
  push:
    branches: [claude/vibrant-cray-177q1d]
    paths: [".github/probe/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun .github/probe/run.ts
      - run: |
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add src/jobs/sources/fixtures && git commit -m "Look at Beacon pass 2 (2026-11-03)" && git push origin HEAD:claude/vibrant-cray-177q1d
