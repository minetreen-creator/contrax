name: Sync Bids

# Bid sync moved off Vercel Cron (Hobby 10s function cap kills a 6–15 min
# sync). It now runs here on GitHub Actions, where the job can run for up to
# 6 hours and is free on public repos.
#
# Required secrets (owner must set in GitHub repo settings → Secrets):
#   DATABASE_URL   — Neon Postgres connection string (same value as the Vercel
#                    project env var). REQUIRED; the run fails without it.
#   (Emails are sent by daily-emails.yml, not by this workflow.)

on:
  schedule:
    # Weekdays every 4 hours (UTC); weekends once a day (owner 2026-10-06:
    # "once on Saturday and once on Sunday"). Agencies post little on
    # weekends, so the extra weekend runs found almost nothing. The weekend
    # run keeps weekend postings from waiting until Monday; weekdays-only
    # (no weekend run at all) once left the homepage's 24-hour "Newest
    # solicitations" section empty from Friday evening to Monday.
    # 32 runs/week (was 42).
    - cron: "0 */4 * * 1-5"
    - cron: "0 15 * * 0,6"
  workflow_dispatch:

concurrency:
  group: sync-bids
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Run bid sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # WISCONSIN DOA VENDORNET (wi_vendornet) - the bids family's only
      # browser-rendered source. vendornet.wi.gov/Bids is a Blazor Server + Telerik
      # grid whose rows exist only over a WebSocket, so the collector needs a driver.
      # Same proven pattern as the Phase-1 spike (PR #582): the runner image ALREADY
      # ships Chrome, puppeteer-core is installed EPHEMERALLY into $RUNNER_TEMP, and
      # the driver script is COPIED beside it so Node resolves the dependency from the
      # script's own directory. The repo manifest is never touched - the last line
      # FAILS the job if it ever were. NO new cron (owner decision 3): this source
      # runs inside the EXISTING sync-bids schedule, as one more source in the
      # runner's tail registry.
      - name: Install the VendorNet (WI) headless driver (ephemeral, manifest untouched)
        run: |
          D="$RUNNER_TEMP/vendornet"
          mkdir -p "$D"
          cp .github/scripts/vendornet-bids-fetch.mjs "$D/"
          cd "$D"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --no-save --no-package-lock puppeteer-core@24
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code -- package.json bun.lock

      - name: Run bid sync
        env:
          # The collector executes this copy (resolveWiVendornetDriverConfig).
          WI_VENDORNET_FETCH_SCRIPT: ${{ runner.temp }}/vendornet/vendornet-bids-fetch.mjs
        run: bun run sync-bids

      - name: Enforce 90-day raw-IP retention
        run: bun run purge-network-identifiers

      # Emails (the bid digest and Radar match alerts) are no longer sent after
      # each sync. They go out once each morning from daily-emails.yml.
