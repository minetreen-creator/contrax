name: Import Mobile public bids
on:
  push:
    branches: [main]
    paths: [src/jobs/sources/al-mobile.ts, scripts/import-mobile.ts, .github/workflows/import-mobile.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-bids
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Import and verify Mobile notices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run scripts/import-mobile.ts --apply
