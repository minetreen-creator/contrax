name: Daily Emails

# BACKUP trigger (owner 2026-11-09: "github isn't reliable" / "move the email to vercel").
# The morning emails are sent from Vercel: Vercel Cron calls /api/cron/daily-emails every 10
# minutes from 10:00 to 15:50 UTC. This workflow calls the SAME runner
# (src/lib/daily-emails.server.ts) hourly from 10:07 to 23:07 UTC, in case Vercel misses a
# morning. Before each job runs it claims that job for today's New York date in the
# daily_email_runs table, so whichever trigger comes first sends and the other skips: nobody gets
# two emails. Nothing sends before 6 AM New York time.
#
# The jobs (once a day each, in this order):
#   - bid-digest: the paying members' morning bid email, with Auto-Pilot picks
#     (src/jobs/send-bid-digest.ts);
#   - trial-emails, weekly-digest (Mondays), radar-alerts (weekly per lead),
#     max-reminders, award-check ("Did I win?").
#
# Secrets: DATABASE_URL, RESEND_API_KEY; optional OPENAI_API_KEY or OPEN_AI_KEY (Auto-Pilot
# top-ups; its scoring runs on Vercel before 6 AM).

on:
  schedule:
    - cron: "7 10-23 * * *"
  workflow_dispatch:

concurrency:
  group: daily-emails
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    name: Send morning emails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # The owner saved the secret as OPEN_AI_KEY; either name works (autopilot.server.ts).
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPEN_AI_KEY: ${{ secrets.OPEN_AI_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Send the morning emails (skips any already sent today)
        run: bun run daily-emails
