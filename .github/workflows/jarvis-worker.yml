name: Jarvis Worker (Phase 5)

# Scheduled Supervised Worker — runs the Phase 5 server-side Jarvis worker on a
# schedule, headlessly, inside GitHub Actions (mirrors the bid-sync-on-GHA
# pattern: the job can run as long as it needs and is free on public repos).
#
# Required secrets (owner must set in GitHub repo settings → Secrets):
#   DATABASE_URL   — Neon Postgres connection string (same value as the Vercel
#                    project env var). REQUIRED; the run fails without it.
#
# Each cadence has a DISTINCT cron so exactly one kind fires per schedule event.
# The single worker job reads `github.event.schedule` to decide which kind to run:
#   hourly-health   → every hour         ("17 * * * *")
#   four-hour       → every 4 hours      ("33 */4 * * *")   bid/feed/usage/radar/funnel
#   daily-am        → every day 07:41    ("41 7 * * *")     Executive Brief
#   daily-pm        → every day 19:47    ("47 19 * * *")    review + update hypotheses
#   weekly          → Sundays 06:53      ("53 6 * * 0")     deep strategy review
#
# Manual trigger: `workflow_dispatch` with input KIND = one kind, or "all".
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "33 */4 * * *"
    - cron: "41 7 * * *"
    - cron: "47 19 * * *"
    - cron: "53 6 * * 0"
  workflow_dispatch:
    inputs:
      KIND:
        description: "Worker kind to run (hourly-health | four-hour | daily-am | daily-pm | weekly | all)"
        required: false
        default: "all"

concurrency:
  group: jarvis-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    name: Run scheduled Jarvis worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve worker kind from schedule / dispatch
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            KRON="${{ github.event.schedule }}"
            if   [[ "$KRON" == "17 * * * *" ]];    then KIND=hourly-health;
            elif [[ "$KRON" == "33 */4 * * *" ]];  then KIND=four-hour;
            elif [[ "$KRON" == "41 7 * * *" ]];    then KIND=daily-am;
            elif [[ "$KRON" == "47 19 * * *" ]];   then KIND=daily-pm;
            elif [[ "$KRON" == "53 6 * * 0" ]];    then KIND=weekly;
            else echo "No kind matched schedule '$KRON' — nothing to do"; echo "NOOP=1" >> "$GITHUB_ENV"; exit 0;
            fi
            echo "KIND=$KIND" >> "$GITHUB_ENV"
          else
            echo "KIND=${{ github.event.inputs.KIND || 'all' }}" >> "$GITHUB_ENV"
          fi
      - name: Run scheduled worker
        run: |
          if [[ "${NOOP:-0}" == "1" ]]; then exit 0; fi
          if [[ "$KIND" == "all" ]]; then
            for k in hourly-health four-hour daily-am daily-pm weekly; do
              echo "== $k =="
              KIND=$k bun run scripts/run-worker.ts || exit 1
            done
          else
            KIND=$KIND bun run scripts/run-worker.ts || exit 1
          fi
