name: Temp probe (PlanetBids counts + state gap map, read-only)
on:
  push:
    branches: [claude/vibrant-cray-177q1d]
    paths: [".github/probe/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun .github/probe/gap.ts
      - name: Browser driver (ephemeral)
        run: |
          D="$RUNNER_TEMP/pb"; mkdir -p "$D"; cp .github/scripts/planetbids-bids-fetch.mjs "$D/"
          cd "$D" && npm init -y >/dev/null && npm install --no-audit --no-fund --no-save --no-package-lock puppeteer-core@24
      - run: bash .github/probe/pb.sh
