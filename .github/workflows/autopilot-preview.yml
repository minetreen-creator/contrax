name: Auto-Pilot Preview

# Read-only (owner 2026-11-09): print the Auto-Pilot verdicts the morning email would use for the
# admin account(s) with a business profile. Nothing is stored and no email is sent. Run by hand
# from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Auto-Pilot preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPEN_AI_KEY: ${{ secrets.OPEN_AI_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Print the verdicts
        run: bun run autopilot-preview
