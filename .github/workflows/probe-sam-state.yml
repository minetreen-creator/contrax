name: Probe SAM state filter (temporary)

# One-time diagnostic for the Virginia IT passes (sam_naics_*_va returned 0).
# Removed in the same PR once the right parameter is known.
on:
  pull_request:
    branches: [main]
    paths: [scripts/probe-sam-state.mjs, .github/workflows/probe-sam-state.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe-sam-state.mjs
