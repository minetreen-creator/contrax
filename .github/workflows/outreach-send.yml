name: Outreach Send

# Owner 2026-11-17 (away for a few days): "Send them automatically". Each weekday
# this asks the live site to send the outreach drafts that are waiting on
# /admin/outreach (src/jobs/outreach-send.ts). The site does the sending, so the
# daily limit, the do-not-contact list and the unsubscribe links all hold.
# To stop it: disable this workflow in the Actions tab.

on:
  schedule:
    # 14:07 UTC weekdays = 9:07 AM Eastern, after the morning jobs have queued the day's drafts.
    - cron: "7 14 * * 1-5"
  workflow_dispatch:

concurrency:
  group: outreach-prepare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    name: Send waiting outreach drafts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Send
        run: bun run outreach-send
