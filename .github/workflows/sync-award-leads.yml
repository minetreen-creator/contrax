name: Sync award leads
# New federal contract winners from USAspending.gov (owner 2026-10-06, revenue
# idea #6) into award_leads, sold on /leads. Same pattern as sync-gsa-primes.yml:
# GitHub Actions, never Vercel cron. Weekdays 13:20 UTC.
on:
  schedule:
    - cron: "20 13 * * 1-5"
  workflow_dispatch:
concurrency:
  group: sync-award-leads
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    name: Sync award leads
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Sync award leads
        run: bun run sync-award-leads
