name: Import DHS forecasts
on:
  push:
    branches: [main]
    paths:
      - data/dhs-forecasts-2026-09-30.json
      - scripts/import-dhs-forecasts.ts
      - .github/workflows/import-dhs-forecasts.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: import-dhs-forecasts
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run scripts/import-dhs-forecasts.ts --apply
