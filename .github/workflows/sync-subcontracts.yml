name: Sync subcontracts (SBA SUBNet)
# SUBCONTRACTING preview — the DAILY refresh of the SUBNet subcontracting board
# (owner directive 2026-09-25, BUILD-PLAN.md §6.1 S1 / §6.2). Same pattern as
# sync-bids.yml / sync-far.yml: GitHub Actions, never Vercel cron.
#
# CADENCE (BUILD-PLAN §6.1): ONCE DAILY at 14:00 UTC. The source has no publish or
# update timestamp and changes slowly — more often would just re-fetch the same board.
# A full sweep is ~15 index requests (10 rows per page) plus ONE detail request per
# NEW notice, serialised at one request per second with a descriptive UA, so the job
# is a couple of minutes of polite traffic even on a first run.
#
# WHAT IT WRITES: subcontract_opportunities (+ the run row in subcontract_sync_runs).
# A FAILED sweep writes nothing but its `error` run row (fail-closed), and the job
# exits 1 so a failure is visible in the Actions UI rather than silent.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
concurrency:
  group: sync-subcontracts
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    name: Run SUBNet subcontract sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the SUBNet subcontract sweep
        # Honest counting in the log: rows seen / new / updated / unchanged, the
        # requests actually spent (index pages + detail pages), how the pager ended
        # the sweep, and the closed-hidden / unverified-hidden buckets.
        run: bun run sync-subcontracts
