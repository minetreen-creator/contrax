<section class="container pt-3 pb-3">
	
	<p>Polk County’s Procurement Division oversees how taxpayer money is spent and provides purchasing of goods and services for all divisions within the county.</p>
<p>If the county needs services to be performed by an outside contractor, including architectural design, engineering and design-build services, the procurement office makes it happen. This office assists all county divisions with using the correct procurement methods, meeting <a href="https://library.municode.com/fl/polk_county/codes/code_of_ordinances?nodeId=COOR_CH2AD_ARTIXPR_S2-291SACOREPEPRBECO#:~:text=Women%20or%20minority%20owned%20entity,day%20operations%20of%20the%20firm." target="_blank" rel="noopener">local vendor and women/minority business requirements</a> and training vendors on how to submit quotes, bids and request for proposals.</p>
	
</section>
