name: Sync award leads
# New federal contract winners from USAspending.gov (owner 2026-10-06, revenue
# idea #6) into award_leads, sold on /leads. Same pattern as sync-gsa-primes.yml:
# GitHub Actions, never Vercel cron. Weekdays 13:20 UTC.
on:
  schedule:
    - cron: "20 13 * * 1-5"
  workflow_dispatch:
    # A past slice of history (owner 2026-11-11). Leave all three empty for the normal run.
    inputs:
      end:
        description: "Last day of the slice, e.g. 2026-08-31 (empty = today)"
        required: false
        default: ""
      days:
        description: "Days in the slice, 1 to 31 (empty = 10)"
        required: false
        default: ""
      max_pages:
        description: "Page limit, 100 awards each (empty = 60)"
        required: false
        default: ""
concurrency:
  group: sync-award-leads
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    name: Sync award leads
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Sync award leads
        env:
          SLICE_END: ${{ inputs.end }}
          SLICE_DAYS: ${{ inputs.days }}
          SLICE_MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          args=""
          if [[ "$SLICE_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then args="$args --end=$SLICE_END"; fi
          if [[ "$SLICE_DAYS" =~ ^[0-9]{1,2}$ ]]; then args="$args --days=$SLICE_DAYS"; fi
          if [[ "$SLICE_MAX_PAGES" =~ ^[0-9]{1,3}$ ]]; then args="$args --max-pages=$SLICE_MAX_PAGES"; fi
          bun run sync-award-leads -- $args
