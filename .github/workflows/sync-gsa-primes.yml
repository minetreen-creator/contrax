name: Sync GSA prime directory
# SUBCONTRACTING preview — the WEEKLY check of the GSA prime contractor directory
# (owner-approved expansion 2026-09-26). Same pattern as sync-subcontracts.yml /
# sync-bids.yml: GitHub Actions, never Vercel cron.
#
# CADENCE: ONCE A WEEK, Monday 15:00 UTC — its own job, so the DAILY SBA SUBNet sweep
# (14:00 UTC) is untouched. The source publishes ONE annual CSV, so a weekly conditional
# GET is all that is needed to catch a new annual file within a week; more often would
# imply an update cadence the source does not have.
#
# WHAT IT WRITES: subcontract_primes (the GSA source's rows) + one run row in
# subcontract_sync_runs. A 304 (or bytes identical to the stored sha256) writes NO
# directory row but still records an `ok` run, so "last checked by Contrax" stays
# truthful. A failure writes its `error` run row and NOTHING else — the previously
# stored rows keep being served — and the job exits 1 so the failure is visible in the
# Actions UI instead of being silent.
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
concurrency:
  group: sync-gsa-primes
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    name: Run GSA directory check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the GSA directory check
        # Honest counting in the log: rows seen / inserted / updated / unchanged, rows that
        # vanished from the latest file (counted, never deleted), rows whose NAICS cell is not
        # a valid six-digit code (kept, counted, stored verbatim in naics_raw), rows whose
        # state reads "Non-US", the source's own file name + file date, the Last-Modified,
        # the content sha256, which resolution path found the CSV, and the requests spent.
        run: bun run sync-gsa-primes
