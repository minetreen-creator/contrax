<!DOCTYPE html><html><head><title>Procurement Calendar | New Jersey Public Transportation Corporation</title></head><body><div id="__nuxt"></div><script type="application/json" data-nuxt-data="nuxt-app" data-ssr="true" id="__NUXT_DATA__">[{"data": 1}, "page", "<div style=\"margin-bottom: 15px;\"><p>Welcome to NJ TRANSIT\u2019s Public Notices and Advertisements portal. On this page you will find public notices for NJ TRANSIT procurements. Advertisements can be viewed by selecting the advertisement link in the Description box for each solicitation below. Full procurement packages are available on <a href=\"https://www.infotechexpress.com/login\" target=\"_blank\" title=\"bidexpress\" aria-label=\"bid-express\">bidexpress.com</a></p><p>Archived solicitations can be found by selecting the fiscal year below.</p><p><span style=\"color:#b61d8d;\"><strong>UPCOMING PROCUREMENT OPPORTUNITY&nbsp;</strong></span></p><p>To support our partners and in recognition of the significant time and effort required to prepare proposals/bids, NJ TRANSIT is providing advance notice of <a href=\"https://content.njtransit.com/sites/default/files/Upcoming%20Procurement%20Opps%20rev%2010-27-26.bg.docx\" target=\"_blank\" title=\"upcoming bidding\" aria-label=\"upcoming bidding opportunities\">upcoming bidding opportunities</a>. Full IFB and RFP packages will only be available on <a href=\"https://www.infotechinc.com/bidexpress/\" target=\"_blank\" title=\"Bid Express\" aria-label=\"Bid-express\">bidexpress.com</a>. This information is for planning purposes; dates are subject to change.</p><p><span style=\"color:#b61d8d;\"><strong>NJ TRANSIT is excited to announce that we will soon be releasing Request for Proposals for our Task Order Contract Program. &nbsp;</strong></span></p><p><strong>Expected Advertisement: November</strong></p><ul type=\"circle\"><li class=\"ck-list-marker-bold\" style=\"margin-bottom:0in;\" data-list-item-id=\"e6837d3c78fea13b61f50713520ae1e45\"><span style=\"font-family: osts for submitting a proposal.</strong></span></p><p><a href=\"https://content.njtransit.com/sites/default/files/RFP%200000241_Advertisement.pdf\">RFP 0000241_Advertisement.pdf</a></p><p>&nbsp;</p></td><td>RFP No. 0000241</td><td>Electronic Only via Bid Express - Conf. Call Dial-in Number: 1-862-294-4371 Conference ID: 726 838 598#</td><td>Evelyn Gonzales</td><td><span class=\"fontawesome-icon-inline\" aria-label=\"No bids received\"><i class=\"fa fa-times-circle fa-xs fa-fw\" aria-hidden=\"true\" style=\"color: #F79B42; font-size: 20px;\"></i></span></td></tr><tr><td>12/22/26</td><td>02:00</td><td><p>Electronic Bids Due for IFB No. 26-021X, \"HOWELL GARAGE ABOVEGROUND STORAGE TANK UPGRADE.\" General navigation, registration, and solicitation review of www.bidexpress.com prior to actual selection of a solicitation for bidding is FREE. <span style=\"background-color:hsl(30,75%,60%);\"><strong>NOTE: There are no costs for submitting a bid.</strong></span></p><p><a href=\"https://content.njtransit.com/sites/default/files/IFB%20No.%2026-021X%20Advertisement.pdf\">IFB No. 26-021X Advertisement.pdf</a></p><p>&nbsp;</p></td><td>IFB No. 26-021X</td><td>Electronic Only via Bid Express - Conf. Call Dial-in Number: 1-862-294-4371 Conference ID: 726 838 598#</td><td>Kimberley Murray</td><td><span class=\"fontawesome-icon-inline\" aria-label=\"No bids received\"><i class=\"fa fa-times-circle fa-xs fa-fw\" aria-hidden=\"true\" style=\"color: #F79B42; font-size: 20px;\"></i></span></td></tr><tr><td>12/10/26</td><td>11:00</td><td><p>Proposals Due: RFP No. 0000186, \"MANAGEMENT, OPERATION, AND MAINTENANCE OF RAIL STATION COMMUTER PARKING FACILITIES.\" General navigation, registration, and solicitation review of www.bidexpress.com prior to actual selection of a solicitation for proposing is FREE. <span style=\"background-color:hsl(30,75%,60%);\"><strong>NOTE: There are no costs for submitting a proposal.&nbsp;</strong></span></p><p>&nbsp;</p><p><a href=\"https://content.njtransit.co
