name: Import Arizona APP bids
on:
  pull_request:
    branches: [main]
    paths: [data/az-open-solicitations-2026-10-04.json, scripts/import-az-app.ts, .github/workflows/import-az-app.yml]
  push:
    branches: [main]
    paths: [data/az-open-solicitations-2026-10-04.json, scripts/import-az-app.ts, .github/workflows/import-az-app.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: import-az-app
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Validate snapshot
        run: bun run scripts/import-az-app.ts
      - name: Import and verify production records
        if: github.event_name != 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run scripts/import-az-app.ts --apply
